name: ddc_dictionary
description: >
  Dzongkha-English dictionary app by the Dzongkha Development Commission
  (རྫོང་ཁ་གོང་འཕེལ་ལྷན་ཚོགས།).
publish_to: 'none'

# 2.0.0 marks the rewrite: new architecture, indexed/FTS search, favorites,
# history, word of the day, dark mode. See README.md for the full story.
version: 2.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter

  # State management. Chosen over the old app's hand-rolled BroadcastStream
  # "bloc" because it gives proper dependency injection, testable providers,
  # and automatic widget rebuild scoping with no boilerplate stream plumbing.
  flutter_riverpod: ^2.5.1

  # Local dictionary database (unchanged choice from the old app -- sqflite
  # is still the standard, well-maintained SQLite binding for Flutter).
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.3

  # sqflite's plugin implementation only covers Android/iOS. This FFI-based
  # factory is what lets the app also run on macOS/Windows/Linux desktop --
  # handy for quick local testing without an emulator/simulator. See
  # main.dart, where it's wired in only for desktop platforms.
  sqflite_common_ffi: ^2.3.3

  # Persist small user preferences (theme mode, text scale) without needing
  # a database round-trip.
  shared_preferences: ^2.2.3

  cupertino_icons: ^1.0.6
  sqflite_common_ffi_web: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo.png"

flutter:
  uses-material-design: true

  assets:
    - assets/logo.png
    - assets/ddc.jpg
    - assets/cst.png
    - assets/dzo.png
    - assets/db/ddc_dictionary.db

  fonts:
    - family: jomolhari
      fonts:
        - asset: assets/Jomolhari-Regular.ttf
